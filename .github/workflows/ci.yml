name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests build their own throwaway databases; never touch a real one.
  EIFO_CONFIG_FILE: config/does-not-exist.toml

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the workspace
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: Tests - eifo-core (coverage gate 90%)
        run: uv run pytest packages/eifo-core --cov=eifo_core --cov-fail-under=90

      - name: Tests - eifo-api and eifo-fetcher (coverage gate 85%)
        run: >
          uv run pytest packages/eifo-api packages/eifo-fetcher
          --cov=eifo_api --cov=eifo_fetcher --cov-fail-under=85

      - name: Client logic tests
        run: node --test "web/tests/*.test.js"

      - name: Migrations apply from scratch
        run: |
          EIFO_DB_URL="sqlite:///${RUNNER_TEMP}/ci.db" uv run eifo-fetch db upgrade
          EIFO_DB_URL="sqlite:///${RUNNER_TEMP}/ci.db" uv run eifo-fetch db current

  sidecar:
    # The menu-bar companion. macOS because it is AppKit all the way down -
    # NSStatusItem, NSOpenPanel, SMAppService - and there is nothing to check on
    # a runner that has none of them.
    #
    # Its own job rather than a step in the Python one: it shares no toolchain
    # with the rest of the pipeline, and a Rust build failing should read as the
    # sidecar failing rather than as the test suite failing.
    name: sidecar (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sidecar

      - name: Format
        run: cargo fmt --manifest-path sidecar/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path sidecar/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path sidecar/Cargo.toml

      - name: It builds a bundle
        run: ./sidecar/build-app.sh

  windows:
    # Off by default: a full Windows run costs about fourteen minutes, which is
    # most of the pipeline, to re-check something that changes only when
    # platform-specific code does. Run it from the Actions tab ("Run workflow")
    # after touching anything that talks to the filesystem or the OS directly.
    #
    # It earned its keep on its first run - an `import fcntl` that made every
    # eifo-fetch command unrunnable, and image paths stored with backslashes
    # that would have 404ed every poster in the catalog - so it is disabled
    # rather than deleted.
    name: Tests on Windows
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the workspace
        run: uv sync --locked

      - name: Tests
        # --basetemp, because every test in the suite gets a tmp_path whether it
        # asks for one or not (the autouse fixture in conftest.py), and half of
        # them build a SQLite database in it. Windows puts the default temp
        # directory on C:, the OS disk; the workspace and the uv cache are on
        # D:, the local SSD. That left the one thing done a thousand times per
        # run pointed at the slow volume - the first third of the suite took
        # 11m39s of a 13m47s run, against 9 seconds for the same tests on Linux.
        #
        # Its own subdirectory rather than RUNNER_TEMP itself: pytest deletes
        # the basetemp at startup, and setup-uv keeps its cache next door.
        run: uv run pytest --basetemp="${{ runner.temp }}\pytest"

      # What follows is deliberately not pytest. The `import fcntl` that made
      # every eifo-fetch command unrunnable was invisible to a test suite that
      # imports the module rather than starts the program, and it is what
      # somebody on Windows meets first. So every subcommand starts a real
      # process here, and between them they import every source plugin, every
      # enricher, Pillow, APScheduler and Alembic.
      #
      # One command per step, because PowerShell fails a step on its last
      # command's exit code alone and would shrug at anything before it - which
      # is exactly the shape of a broken import in one command out of ten.
      - name: The CLI starts
        run: uv run eifo-fetch --version

      - name: db upgrade
        run: uv run eifo-fetch db upgrade

      - name: db current
        run: uv run eifo-fetch db current

      - name: sources list
        run: uv run eifo-fetch sources list

      - name: sync (imports every source plugin)
        run: uv run eifo-fetch sync --source no-such-source

      - name: enrich (imports every enricher)
        run: uv run eifo-fetch enrich --limit 0 --skip-imdb

      - name: images (imports Pillow)
        run: uv run eifo-fetch images --limit 0

      - name: repair-names
        run: uv run eifo-fetch repair-names --limit 0

      - name: review list
        run: uv run eifo-fetch review list

      - name: review auto
        run: uv run eifo-fetch review auto

      - name: dedupe (takes the fetcher lock)
        # msvcrt.locking is the half of lock.py no other platform executes a
        # line of, and a lock that never locks looks exactly like one that does
        # until two fetchers run at once.
        run: uv run eifo-fetch dedupe

      - name: The daemon module imports
        # `daemon --help` does not reach it: the import is inside the command,
        # so argparse answers and APScheduler is never touched. On Windows that
        # import is the one that needs tzdata, which arrives only as a marker
        # dependency of tzlocal.
        run: uv run python -c "import eifo_fetcher.daemon"

  privacy:
    # Its own job so a privacy regression is named on the pull request rather
    # than buried in a line of the main test run (docs.internal/10-quality.md).
    name: Privacy suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the workspace
        run: uv sync --locked

      - name: No identity leaks, no-store on user routes, no query strings in logs
        run: uv run pytest packages/eifo-api/tests/test_privacy.py

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t eifo:ci .

  badge:
    # The test count comes from the suite itself rather than being typed into
    # the README, where it would start drifting the same afternoon.
    #
    # The number is written into a static shields.io URL rather than served
    # from a JSON file here: shields fetches on its own servers, anonymously,
    # so it cannot read anything in a private repository. A static badge needs
    # no access at all, and keeps working if the repo is ever made public.
    name: Refresh the test-count badge
    needs: [quality, privacy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the workspace
        run: uv sync --locked

      - name: Count the tests
        id: count
        run: |
          python_tests=$(uv run pytest --collect-only 2>/dev/null \
            | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+')
          node_tests=$(node --test --test-reporter=tap "web/tests/*.test.js" \
            | grep -oE '^# tests [0-9]+' | grep -oE '[0-9]+$')
          echo "total=$((python_tests + node_tests))" >> "$GITHUB_OUTPUT"

      - name: Write the count into the README badge
        run: |
          sed -i -E \
            "s|(img\.shields\.io/badge/tests-)[^)]*|\1${{ steps.count.outputs.total }}%20passing-brightgreen|" \
            README.md

      - name: Commit it, if it moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && echo "unchanged" && exit 0
          # [skip ci] so a badge commit does not trigger another run of everything.
          git commit -m "chore: ${{ steps.count.outputs.total }} tests [skip ci]"
          git push
