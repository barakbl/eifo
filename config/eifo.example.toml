# Eifo configuration - copy to config/eifo.toml and edit.
#
# This file holds NO secrets. API keys and OAuth credentials come from the
# environment only (EIFO_* variables, see .env.example).
# Precedence: built-in defaults <- this file <- EIFO_* environment variables.

db_url = "sqlite:///data/eifo.db"
images_dir = "data/images"
public_origin = "http://localhost:8000"

# Titles whose availability data is older than this are reported as stale by
# GET /api/v1/meta (the health endpoint).
stale_after_hours = 48

# The API applies any pending migration as it starts, so upgrading is a
# restart and nothing else. Set false to keep that a deliberate step: the
# API then refuses to serve a database that has not been migrated.
auto_migrate = true

# ---------------------------------------------------------------------------
# Sources - one table per tracked service. Flipping `enabled = false` retires a
# source: the next sync marks it inactive and ALL of its data is kept, badged in
# the UI as "no longer tracked". See docs.internal/03-sources.md.
# ---------------------------------------------------------------------------

# Covered by the tmdb-providers harvester (JustWatch data, region IL).
# The Israeli operators (yes+, Sting TV, HOT, Cellcom TV, Partner TV) are NOT
# here: JustWatch does not track them, so they would sync cleanly and stay
# empty forever. See docs.internal/03-sources.md.
[sources.netflix_il]
enabled = true
# max_pages = 50   # pages per media type; raise for a fuller catalog

[sources.prime_video_il]
enabled = true

[sources.apple_tv_plus]
enabled = true

[sources.hbo_max_il]
enabled = true

[sources.mubi_il]
enabled = true

[sources.crunchyroll_il]
enabled = false

# Not in JustWatch's IL provider list despite being available here, so it has
# a dedicated plugin reading the sitemaps Disney publishes for the region.
[sources.disney_plus_il]
enabled = true
# Two sitemap requests per sync; no need to be gentle, but be polite anyway.
rate_limit_rps = 1.0

[sources.freetv]
enabled = true
# One public JSON API (RedGalaxy portal) carries the whole ~5,700-title catalog;
# a full sweep is a few dozen requests. No auth. See the acquisition research doc.
rate_limit_rps = 1.0

# Free broadcaster VODs - dedicated plugins.
[sources.mako]
enabled = true
rate_limit_rps = 0.5

# Kan Box (Kan 11 / IPBC) - free public-broadcaster VOD. The site is behind
# Cloudflare bot management that 403s any non-browser client, so this plugin
# reads the three server-rendered lobby pages (kan-box, series, digital-lobby)
# through a headless Chromium. The Docker image ships one; running from a
# checkout needs `uv run playwright install chromium` once. Three page views
# plus one robots.txt fetch per sync - the WAF allows one page per cleared
# session, so the plugin uses a fresh, politely-spaced context per lobby.
[sources.kan]
enabled = true
rate_limit_rps = 0.5

# Reshet 13 - free broadcaster VOD. Like Kan, the site 403s non-browser
# clients, so this plugin reads the two public screens (all shows, news) and
# their embedded __NEXT_DATA__ catalog through the same headless Chromium.
# Two page views plus one robots.txt fetch per sync, one browser session.
[sources.reshet13]
enabled = true
rate_limit_rps = 0.5

# Tel Aviv Cinematheque VOD - Israeli arthouse film, paid for per title.
# The only source here that charges per title, so its offers carry a price,
# read per title from the ticketing system (prices differ, and some titles
# are free). One request for the whole catalog plus one per title, and a
# card only counts while it still links to the till - so what is listed is
# what can be watched today. Links go to the film's page, not the checkout.
[sources.cinematheque_vod]
enabled = true
rate_limit_rps = 1.0

# Israeli Film Archive (Jerusalem Cinematheque) - the national archive's own
# digitised collection, about 940 films: roughly half free to watch, the
# rest sold per title, each offer carrying the price its page quotes. The
# heaviest sync here by far: the site has no page listing the collection, so
# the plugin reads the sitemap and then one page per film. Keep the rate
# limit gentle - this is a nonprofit archive, and a nightly sweep is plenty.
[sources.israel_film_archive]
enabled = true
rate_limit_rps = 1.0

# Not implemented: Now 14 turned out to be a news site with no VOD catalog.
# See docs.internal/03-sources.md for what was verified.
[sources.now14]
enabled = false

# ---------------------------------------------------------------------------
# Score aggregation - see docs.internal/06-enrichment.md
# ---------------------------------------------------------------------------

# How often ratings are refreshed, and which providers are switched on.
[enrich]
refresh_days = 14        # ratings older than this are refetched
hot_refresh_days = 3     # titles currently available somewhere stay fresher
batch_size = 500         # titles per run, bounding a scheduled enrich
retry_days = 30          # wait after nobody could rate a title; doubles each time
retry_error_days = 1     # wait after a provider failed rather than came back empty
retry_max_days = 365     # ceiling on those doublings
disabled = []            # enricher keys to switch off, e.g. ["rt"]
# Seret is off by default: the site publishes no working title search, so a
# title cannot be resolved to a page id. See docs.internal/06-enrichment.md.
enabled = []             # providers that are otherwise off, e.g. ["seret"]

[scores.weights]
imdb = 3.0
rt_critics = 2.0
rt_audience = 1.0
tmdb = 1.0
seret_critics = 2.0
seret_viewers = 1.5
edb = 0.5

# ---------------------------------------------------------------------------
# Daemon schedule (ignored when using system cron)
# ---------------------------------------------------------------------------

[schedule]
# When the nightly run starts, UTC. One time for the whole thing: sync, enrich
# and artwork are a chain, not three independent jobs - enrichment needs the
# titles sync creates, and artwork needs the URLs enrichment fills in. A config
# written when they had an hour each still works; its sync time is read as this.
nightly = "03:00"
