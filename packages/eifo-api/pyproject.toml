[project]
name = "eifo-api"
version = "0.1.0"
description = "Eifo REST API"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Barak Bloch", email = "barak.bloch@gmail.com" }]
dependencies = [
    "eifo-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "authlib>=1.4",
    "itsdangerous>=2.2",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eifo_api"]

[tool.uv.sources]
eifo-core = { workspace = true }
