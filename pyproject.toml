[project]
name = "eifo"
version = "0.8.0"  # x-release-please-version
description = "Eifo - Israeli VOD aggregator (workspace root)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
# Contributors are credited in AUTHORS; this field is only the point of contact.
authors = [{ name = "Barak Bloch", email = "barak.bloch@gmail.com" }]
dependencies = [
    "eifo-core",
    "eifo-api",
    "eifo-fetcher",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
eifo-core = { workspace = true }
eifo-api = { workspace = true }
eifo-fetcher = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "mypy>=1.14",
    "ruff>=0.9",
    "httpx>=0.28",
    "respx>=0.22",
    "pre-commit>=4.0",
    "httpx2>=2.9.1",
]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    # Generated by Alembic; kept as emitted so drift is easy to read in diffs.
    "packages/eifo-core/src/eifo_core/migrations/versions",
    # Specifications are prose, not code to be formatted.
    "docs.internal.local",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["eifo_core", "eifo_api", "eifo_fetcher"]

[tool.ruff.lint.per-file-ignores]
# Pytest fixtures legitimately shadow names and use bare asserts.
"**/tests/**" = ["B011"]

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
files = [
    "packages/eifo-core/src",
    "packages/eifo-api/src",
    "packages/eifo-fetcher/src",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

# eifo-core owns the schema and settings: hold it to the strict bar.
[[tool.mypy.overrides]]
module = ["eifo_core.*"]
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
no_implicit_reexport = true
warn_return_any = true

# Alembic's generated scaffolding is not worth typing.
[[tool.mypy.overrides]]
module = ["eifo_core.migrations.*"]
ignore_errors = true

# Third-party packages that ship no type information.
[[tool.mypy.overrides]]
module = ["apscheduler.*", "authlib.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = [
    "packages/eifo-core/tests",
    "packages/eifo-api/tests",
    "packages/eifo-fetcher/tests",
]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: long-running tests; run nightly in CI, not per-PR",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------- coverage

[tool.coverage.run]
branch = true
source = ["eifo_core", "eifo_api", "eifo_fetcher"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
show_missing = true
