[project]
name = "eifo-api"
version = "0.10.0"  # x-release-please-version
description = "Eifo REST API"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Barak Bloch", email = "barak.bloch@gmail.com" }]
dependencies = [
    "eifo-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "authlib>=1.4",
    # Imported directly by eifo_api.oauth to verify the ID token. Authlib
    # happens to depend on it too, which is why this was missing and nothing
    # noticed - but a dependency we import is one we declare, or the day
    # Authlib swaps it out the API stops importing.
    "joserfc>=1.0",
    "itsdangerous>=2.2",
    "httpx>=0.28",
]

[project.scripts]
eifo-api = "eifo_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eifo_api"]

[tool.uv.sources]
eifo-core = { workspace = true }
