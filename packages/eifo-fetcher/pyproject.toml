[project]
name = "eifo-fetcher"
version = "0.1.0"
description = "Eifo catalog fetcher and metadata enricher"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "rapidfuzz>=3.14.5",
    "selectolax>=0.4.11",
    "tenacity>=9.1.4",
    "eifo-core",
]

[project.scripts]
eifo-fetch = "eifo_fetcher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eifo_fetcher"]

[tool.uv.sources]
eifo-core = { workspace = true }
