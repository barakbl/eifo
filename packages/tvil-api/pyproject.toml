[project]
name = "tvil-api"
version = "0.1.0"
description = "TVIL REST API"
requires-python = ">=3.12"
dependencies = [
    "tvil-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "authlib>=1.4",
    "itsdangerous>=2.2",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tvil_api"]

[tool.uv.sources]
tvil-core = { workspace = true }
