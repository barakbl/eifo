name: release-please

# Conventional-commit messages on main drive a rolling "release PR" that rolls
# up the changelog and the next version. The PR bumps version.txt, every
# pyproject.toml, uv.lock and the sidecar crate's Cargo.toml together
# (release-please `extra-files` + the `x-release-please-version` markers on each
# version line), so merging it tags a commit where the package metadata already
# agrees with the tag. Nothing runs after the tag.
#
# sidecar/Cargo.lock is left out on purpose: cargo rewrites it without
# preserving comments, so a marker there would not survive a local build. Its
# eifo-tray version line lags one release and any `cargo build` heals it; no CI
# step passes `--locked` for the sidecar, so nothing breaks in the meantime.
#
# **Land pull requests with rebase or squash, never a merge commit.** A merge
# commit puts two commits on main for one pull request - itself and the commit
# it brought - and release-please credits the pull request's conventional title
# to both, so every entry appeared in the changelog twice from v0.4.0 to
# v0.12.1. GitHub has no merge-commit setting that avoids it: the only message
# combinations it allows all leave the title on the merge commit as well. The
# repository has merge commits switched off for that reason.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
