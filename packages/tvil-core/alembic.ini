# Alembic config for dev use from packages/tvil-core:
#   uv run alembic -c packages/tvil-core/alembic.ini revision --autogenerate -m "..."
#
# The services do not read this file - `tvil-fetch db upgrade` builds an
# equivalent Config programmatically (see tvil_fetcher.migrations).
# The URL is left blank on purpose: env.py falls back to TVIL settings.

[alembic]
script_location = %(here)s/src/tvil_core/migrations
prepend_sys_path = %(here)s/src
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
