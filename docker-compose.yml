# Eifo - API and fetcher from a single image, sharing ./data and ./config.
#
#   cp config/eifo.example.toml config/eifo.toml && cp .env.example .env
#   docker compose up -d
#
# The `migrate` service applies the schema and exits. The API would migrate itself
# at startup (`auto_migrate`), but the fetcher would not, so this keeps one
# service in charge of the schema and lets both wait for it.
#
# The image ships the headless Chromium the `kan` and `reshet13` sources need,
# which is most of its size. Put EIFO_INSTALL_BROWSER=0 in .env for a slim image
# without it - only those two stop working.

x-eifo-image: &eifo-image
  build:
    context: .
    args:
      INSTALL_BROWSER: ${EIFO_INSTALL_BROWSER:-1}
  image: eifo:latest

services:
  migrate:
    <<: *eifo-image
    command: ["eifo-fetch", "db", "upgrade"]
    restart: "no"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    env_file:
      - .env

  api:
    <<: *eifo-image
    restart: unless-stopped
    ports:
      - "3436:3436"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    # urlopen raises on any non-2xx, and a members-only install answers /meta
    # with 401 to anyone not signed in - so the obvious probe reports a healthy
    # server as unhealthy for the entire life of the deployment.
    #
    # The timeout is 20s because it is timing a Python interpreter starting up,
    # not a request. On a small shared vCPU that alone measures 6-9s, so the
    # usual 5s can never pass no matter how quickly the server answers.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import http.client as c, sys; conn = c.HTTPConnection("localhost", 3436, timeout=5); conn.request("GET", "/api/v1/meta"); sys.exit(0 if conn.getresponse().status in (200, 401) else 1)'
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  # Keeps the catalog current: sync, enrich and artwork on the schedule in
  # config/eifo.toml. Drop this service and drive the phases from host cron
  # instead if you would rather not have a long-running process.
  fetcher:
    <<: *eifo-image
    restart: unless-stopped
    command: ["eifo-fetch", "daemon"]
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
