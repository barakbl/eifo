[project]
name = "eifo-core"
version = "0.6.0"  # x-release-please-version
description = "Eifo shared core: settings, database schema and migrations"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Barak Bloch", email = "barak.bloch@gmail.com" }]
dependencies = [
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eifo_core"]
