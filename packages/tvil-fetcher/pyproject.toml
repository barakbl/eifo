[project]
name = "tvil-fetcher"
version = "0.1.0"
description = "TVIL catalog fetcher and metadata enricher"
requires-python = ">=3.12"
dependencies = [
    "tvil-core",
]

[project.scripts]
tvil-fetch = "tvil_fetcher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tvil_fetcher"]

[tool.uv.sources]
tvil-core = { workspace = true }
